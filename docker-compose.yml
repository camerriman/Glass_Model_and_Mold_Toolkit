services:
  app:
    image: python:3.11-slim
    container_name: app
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -lc "python -m pip install --no-cache-dir -r /app/requirements.txt && python -m streamlit run /app/Home.py --server.address=0.0.0.0 --server.port=8501"